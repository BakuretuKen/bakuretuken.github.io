<!DOCTYPE html>
<html>
<head>
<title>Bakuretu Bomb DEMO</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<script src="enchant.min.js"></script>
</head>
<body style="margin:0px; padding: 0px; background-color: #ccc; overscroll-behavior-y: none;">

<div style="display: grid; place-items: center; height: 100vh;">
<script type="text/javascript" charset="utf-8">

var BOMB_GAME_WIDTH  = 540;
var BOMB_GAME_HEIGHT = 810;
var BOMB_GAME_FPS = 12;
var BOMB_GAME_LIMIT_TIME = 180;
var BOMB_GAME_TIMER_LABEL_COLOR = "black";
var BOMB_GAME_BAKURETU_BOMB_RATE = 10;
var BOMB_GAME_BAKURETU_BOMB_SOUND = "off";

var BOMB_GAME_ANIME_IMAGE = 3; // アニメーション画像数（アニメーション利用）
var BOMB_GAME_ANIME_POSITION_X = 196;
var BOMB_GAME_ANIME_POSITION_Y = 118;
var BOMB_GAME_ANIME_FRAME = 1;
var BOMB_GAME_ANIME_WAIT = 40;

var userAgent = navigator.userAgent.toLowerCase();
if(userAgent.indexOf("iphone") == -1 && userAgent.indexOf("android") == -1) {
    document.write('<div id="enchant-stage" style="width:'+BOMB_GAME_WIDTH+'px; height:'+BOMB_GAME_HEIGHT+'px; cursor:hand; margin: 0 auto;"></div>');
}
</script>
</div>

<script src="bakuretubomb106.js"></script>

</body>
</html>
